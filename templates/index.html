<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Comic Story Creator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f1ff;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #5b2cff;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 18px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #5b2cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #431bc7;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f7ff;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            color: #5b2cff;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎨 AI Comic Story Creator</h1>

    <p>Create your own comic story using Gemini AI</p>

    <form id="comicForm">

        <label>Story Idea</label>
        <textarea id="prompt"
                  placeholder="Example: A brave fox exploring an enchanted forest"
                  required></textarea>

        <label>Main Character</label>
        <input type="text"
               id="character"
               placeholder="Example: Arlo the Fox"
               required>

        <label>Setting</label>
        <input type="text"
               id="setting"
               placeholder="Example: Enchanted Forest"
               required>

        <label>Tone</label>
        <select id="tone">
            <option>Adventure</option>
            <option>Funny</option>
            <option>Fantasy</option>
            <option>Mystery</option>
            <option>Friendship</option>
        </select>

        <button type="submit">
            Generate Comic Story
        </button>

    </form>

    <div class="loading" id="loading">
        Generating your comic story...
    </div>

    <div id="result"></div>

</div>

<script>

document.getElementById("comicForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const prompt = document.getElementById("prompt").value;
    const character = document.getElementById("character").value;
    const setting = document.getElementById("setting").value;
    const tone = document.getElementById("tone").value;

    document.getElementById("loading").style.display = "block";
    document.getElementById("result").innerHTML = "";

    try {

        const response = await fetch("/generate", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                prompt: prompt,
                character: character,
                setting: setting,
                tone: tone
            })
        });

        const data = await response.json();

        if (data.success) {
            document.getElementById("result").textContent = data.story;
        } else {
            document.getElementById("result").textContent =
                "Error: " + data.error;
        }

    } catch (error) {

        document.getElementById("result").textContent =
            "Unable to connect to the server.";

    }

    document.getElementById("loading").style.display = "none";

});

</script>

</body>
</html>
